openapi: 3.0.0
info:
  title: Landing Page API
  description: API documentation for the Landing Page application
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /items:
    post:
      summary: Create an inventory item
      operationId: createItem
      requestBody:
        description: Item to add to the inventory
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemBody'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
    get:
      summary: Retrieve all inventory items
      operationId: listItems
      responses:
        '200':
          description: A list of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'
components:
  schemas:
    InventoryItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        quantity:
          type: integer
        isActive:
          type: boolean
        sold:
          type: integer
        createAt:
          type: string
          format: date-time
        updateAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - price
        - quantity
        - isActive
        - sold
        - createAt
        - updateAt
    CreateItemBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        quantity:
          type: integer
        isActive:        openapi: 3.0.0
        info:
          title: Landing Page API
          description: API documentation for the Landing Page application
          version: 1.0.0
        servers:
          - url: http://localhost:3000
            description: Local development server
        paths:
          /items:
            post:
              summary: Create an inventory item
              operationId: createItem
              requestBody:
                description: Item to add to the inventory
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/CreateItemBody'
              responses:
                '201':
                  description: Item created successfully
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/InventoryItem'
            get:
              summary: Retrieve all inventory items
              operationId: listItems
              responses:
                '200':
                  description: A list of inventory items
                  content:
                    application/json:
                      schema:
                        type: array
                        items:
                          $ref: '#/components/schemas/InventoryItem'
        
          /items/{id}:
            parameters:
              - name: id
                in: path
                description: ID of the inventory item
                required: true
                schema:
                  type: integer
                  format: int64
            get:
              summary: Retrieve a single inventory item
              operationId: getItemById
              responses:
                '200':
                  description: The requested item
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/InventoryItem'
                '404':
                  description: Item not found
            put:
              summary: Replace an inventory item
              operationId: replaceItem
              requestBody:
                description: New representation of the item
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/UpdateItemBody'
              responses:
                '200':
                  description: Item updated successfully
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/InventoryItem'
                '404':
                  description: Item not found
            delete:
              summary: Delete an inventory item
              operationId: deleteItem
              responses:
                '204':
                  description: Item deleted successfully
                '404':
                  description: Item not found
        
        components:
          schemas:
            InventoryItem:
              type: object
              properties:
                id:
                  type: integer
                  format: int64
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                quantity:
                  type: integer
                isActive:
                  type: boolean
                sold:
                  type: integer
                createAt:
                  type: string
                  format: date-time
                updateAt:
                  type: string
                  format: date-time
              required:
                - id
                - name
                - price
                - quantity
                - isActive
                - sold
                - createAt
                - updateAt
            CreateItemBody:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                quantity:
                  type: integer
                isActive:
                  type: boolean
              required:
                - name
            UpdateItemBody:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                  format: float
                quantity:
                  type: integer
                isActive:
                  type: boolean
              # all fields optional for partial/replace updates
          type: boolean
      required:
        - name
